<!DOCTYPE html>
<html>
<head>
  <title>All Complaints</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="raise.html">Raise Complaint</a>
  <a href="admin.html">Admin</a>
</div>

<div class="container">
<h2>All Complaints</h2>

<table id="table">
  <tr>
    <th>ID</th>
    <th>Student</th>
    <th>Category</th>
    <th>Status</th>
  </tr>
</table>
</div>

<script>
fetch("http://127.0.0.1:3000/api/complaints")
  .then(res => res.json())
  .then(data => {
    const table = document.getElementById("table");

    data.forEach(c => {
      const row = table.insertRow();

      row.insertCell(0).innerText = c.complaint_id;
      row.insertCell(1).innerText = c.student_id;
      row.insertCell(2).innerText = c.category;
      row.insertCell(3).innerText = c.status;
    });
  });
</script>

</body>
</html>
